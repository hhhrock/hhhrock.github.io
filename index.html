<style>
:root{--ink:#17212b;--muted:#687685;--line:#e2e8ef;--paper:#f6f9fc;--white:#fff;--navy:#18324a;--blue:#2778c8;--blueSoft:#eaf4ff;--green:#147a55;--orange:#ad6500;--shadow:0 12px 32px #18324a14;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--paper)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:17px clamp(16px,4vw,54px);color:#fff;background:var(--navy);box-shadow:0 5px 18px #18324a26}.eyebrow{margin:0 0 5px;color:#a7d0f3;font-size:.7rem;font-weight:800;letter-spacing:.14em}h1,h2,h3,p{margin-top:0}h1{margin:0;font-size:clamp(1.1rem,2.5vw,1.55rem)}.topActions{display:flex;align-items:center;gap:10px}.saveState{color:#c8e7d7;font-size:.8rem;white-space:nowrap}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750}.btn.ghost{color:#fff;background:#ffffff1f}.btn.primary{color:#fff;background:var(--blue)}.btn.outline{color:var(--navy);border:1px solid var(--line);background:#fff}.layout{display:grid;grid-template-columns:minmax(350px,450px) minmax(0,1fr);gap:22px;max-width:1650px;margin:0 auto;padding:24px clamp(12px,4vw,54px) 50px}.panel{min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:var(--shadow)}.panelHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:20px 21px 12px}.panelHead h2{margin:0 0 5px;font-size:1.1rem}.subtle{color:var(--muted);font-size:.8rem;line-height:1.5}.pill{display:inline-flex;border-radius:999px;padding:6px 9px;color:var(--blue);background:var(--blueSoft);font-size:.72rem;font-weight:800;white-space:nowrap}.tabs{display:flex;gap:5px;padding:0 21px 14px;border-bottom:1px solid var(--line)}.tab,.viewBtn{border:1px solid transparent;border-radius:8px;padding:8px 11px;color:var(--muted);background:transparent;font-weight:800}.tab.active,.viewBtn.active{color:var(--blue);border-color:#b8d8f3;background:var(--blueSoft)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 21px;background:#fbfcfe;border-bottom:1px solid var(--line)}.search{grid-column:1/-1;width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none}.search:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2778c81f}select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.views{display:flex;gap:6px;padding:12px 21px 0}.viewBtn{flex:1;border-color:var(--line);background:#fff;font-size:.78rem}.placeList,.mapList{display:grid;gap:10px;padding:15px 21px 21px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;transition:.15s}.card:hover,.card.dragging{border-color:#8ec1ed;box-shadow:0 8px 20px #2778c81c}.card.dragging{opacity:.55}.cardTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.card h3{margin:6px 0 4px;font-size:.96rem}.tag{display:inline-flex;border-radius:999px;padding:3px 7px;color:var(--blue);background:var(--blueSoft);font-size:.65rem;font-weight:800}.tag.food{color:var(--orange);background:#fff4df}.grade{display:inline-flex;border-radius:999px;padding:4px 7px;color:var(--green);background:#e6f7ef;font-size:.66rem;font-weight:800;white-space:nowrap}.summary{margin:8px 0 10px;color:#526170;font-size:.8rem;line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:.7rem;line-height:1.45}.meta strong{color:var(--ink)}.note{margin-top:8px;padding:7px 8px;border-left:2px solid #9ac7ea;color:#52728d;background:#f5faff;font-size:.7rem;line-height:1.4}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 6px;color:var(--navy);background:#fff;font-size:.72rem;font-weight:800}.actions .add{color:var(--blue);border-color:#b8d8f3;background:var(--blueSoft)}.mapItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px dashed #aac5dc;border-radius:11px;background:#f4faff}.mapItem strong{display:block;font-size:.84rem}.mapItem span{display:block;margin-top:3px;color:var(--muted);font-size:.7rem}.schedule{overflow:hidden}.scheduleHead{align-items:center}.scheduleBoard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:10px 21px 21px}.day{min-height:190px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;transition:.15s}.day.drop{border-color:var(--blue);background:#f1f8ff;box-shadow:inset 0 0 0 2px #2778c81c}.dayHead{display:flex;justify-content:space-between;gap:5px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}.dayHead strong{font-size:.84rem}.dayHead span{color:var(--muted);font-size:.65rem}.dayBody{display:grid;gap:7px;padding:9px;min-height:135px}.empty{display:grid;place-items:center;min-height:115px;color:#8a97a4;text-align:center;font-size:.72rem;line-height:1.5}.scheduleCard{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:8px;border:1px solid #d8e1ea;border-radius:9px;background:#fff;cursor:pointer;transition:.15s}.scheduleCard:hover{border-color:#8ec1ed;box-shadow:0 6px 16px #2778c81c}.scheduleCard .grip{color:#93a3b3;cursor:grab;touch-action:none;user-select:none;display:block;text-align:center;font-size:.72rem;line-height:1}.scheduleCard.dragSource{opacity:.4}.dragGhost{position:fixed;z-index:50;pointer-events:none;padding:8px 10px;border-radius:9px;background:#fff;border:1px solid #8ec1ed;box-shadow:0 10px 24px #18324a33;font-size:.74rem;font-weight:800;color:var(--navy);transform:translate(-50%,-50%);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scheduleCard strong{display:block;font-size:.74rem}.scheduleCard small{display:block;margin-top:2px;color:var(--muted);font-size:.64rem}.icon{border:0;color:#7b8997;background:transparent;font-size:1rem}.reorder{display:flex;flex-direction:column;gap:2px}.icon.small{font-size:1.15rem;padding:4px 8px;line-height:1;border-radius:6px}.icon.small:not(:disabled):hover{background:#eef3f8}.icon:disabled{opacity:.25;cursor:default}.backdrop.center{justify-content:center;align-items:center}.dayPicker{width:min(360px,92vw);padding:20px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}.dayPicker h3{margin:0 0 14px;font-size:1rem}.dayPickerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.dayPickerGrid button{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;font-weight:800;text-align:left}.dayPickerGrid button:hover{border-color:#8ec1ed;background:var(--blueSoft)}.dayPickerGrid button small{display:block;color:var(--muted);font-weight:600;font-size:.7rem;margin-top:2px}.route{margin:0 3px -2px;padding:4px 6px;border-left:2px solid #9ac7ea;color:#52728d;font-size:.64rem;line-height:1.35}.notice{display:none;margin:0 21px 15px;padding:9px 11px;border-radius:9px;color:#24547b;background:#edf7ff;font-size:.77rem}.notice.show{display:block}.emptyList{padding:25px 8px;color:var(--muted);text-align:center;font-size:.82rem;line-height:1.5}.backdrop{position:fixed;inset:0;z-index:30;display:none;justify-content:flex-end;background:#0a192661}.backdrop.open{display:flex}.detail{width:min(480px,100%);height:100%;overflow:auto;padding:24px;background:#fff;box-shadow:-15px 0 45px #18324a2e}.detailTop{display:flex;justify-content:space-between;gap:10px}.detailTop h2{margin:9px 0 4px;font-size:1.38rem;letter-spacing:-.04em}.close{border:0;color:var(--muted);background:transparent;font-size:1.5rem}.lead{margin:17px 0;color:#526170;line-height:1.65;font-size:.85rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.item{padding:10px;border-radius:9px;background:#f6f8fa}.item small{display:block;margin-bottom:4px;color:var(--muted);font-size:.67rem}.item strong{font-size:.78rem;line-height:1.35}.section{margin:18px 0}.section h3{margin-bottom:7px;font-size:.87rem}.section p,.section li{color:#526170;font-size:.8rem;line-height:1.6}.sources{display:grid;gap:6px;padding:0;list-style:none}.sources a{color:var(--blue);font-size:.78rem;text-decoration:none}.detailFooter{display:flex;gap:8px;margin-top:22px}.detailFooter>*{flex:1;text-align:center;text-decoration:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1080px){.layout{grid-template-columns:1fr}.placeList{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}.topActions{width:100%;justify-content:space-between}.layout{padding:13px 10px 32px}.panelHead,.tabs,.controls,.views,.placeList,.mapList,.scheduleBoard{padding-left:15px;padding-right:15px}.placeList{grid-template-columns:1fr}.scheduleBoard{grid-template-columns:repeat(6,minmax(205px,1fr));overflow-x:auto}.scheduleHead{align-items:flex-start;flex-direction:column}.detail{padding:19px}}
</style>
<style id="memo-overrides">
  .scheduleNote{margin-top:6px;padding:6px 7px;border-left:2px solid #f0b84b;color:#765615;background:#fff9e8;font-size:.66rem;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}

<body>
<div class="app"><header class="topbar"><div><p class="eyebrow">FUKUOKA FAMILY TRIP · FINAL PLANNER</p><h1>냥아♡ 후쿠오카 가자</h1></div><div class="topActions"><span class="saveState" id="saveState">● 저장 준비</span><button class="btn ghost" id="addPlace" type="button">내 장소 추가</button><button class="btn ghost" id="reset" type="button">일정 초기화</button></div></header>
<div class="mobileTabs" role="tablist"><button class="mobileTab active" data-mobiletab="places" type="button">후보 탐색</button><button class="mobileTab" data-mobiletab="schedule" type="button">일정 보기 <span id="mobileScheduleCount"></span></button></div>
<main class="layout"><section class="panel" id="placesPanel"><div class="panelHead"><div><h2>후보 탐색</h2><p class="subtle">날짜와 관계없이 후보를 먼저 고른 뒤 원하는 날짜에 배치하세요. 가족등급 높은순(A→D)으로 정렬됩니다.</p></div><span class="pill" id="placeCount">0개</span></div><div class="tabs"><button class="tab active" data-cat="all">전체</button><button class="tab" data-cat="spot">관광지</button><button class="tab" data-cat="restaurant">음식점</button><button class="tab" data-cat="shopping">쇼핑몰</button></div><div class="controls"><label class="sr" for="search">검색</label><input class="search" id="search" type="search" placeholder="장소명·지역·음식 종류 검색"><label class="sr" for="area">지역</label><select id="area"><option value="all">전체 지역</option></select><label class="sr" for="grade">가족등급</label><select id="grade"><option value="all">가족등급 전체</option><option value="A">A 적극추천</option><option value="A/B">A/B 조건부 추천</option><option value="B">B 추천</option><option value="C">C 조건부</option><option value="D">D 더많은장소</option></select></div><div class="placeList" id="placeList"></div></section>
<section class="panel schedule" id="schedulePanel"><div class="panelHead scheduleHead"><div><h2>5박 6일 일정</h2><p class="subtle">후보를 끌어다 놓거나 카드의 날짜 배치 버튼을 사용하세요. DAY 1은 벳푸 이동, DAY 2는 차량 반납·하카타 전환 기준입니다.</p></div><span class="pill" id="scheduleCount">0개 배치</span></div><div class="notice" id="notice" role="status"></div><div class="scheduleBoard" id="scheduleBoard"></div></section></main></div>
<div class="backdrop" id="backdrop" aria-hidden="true"><aside class="detail" role="dialog" aria-modal="true"><div id="detail"></div></aside></div>
<div class="backdrop center" id="dayPickerBackdrop" aria-hidden="true"><div class="dayPicker" role="dialog" aria-modal="true"><h3 id="dayPickerTitle">날짜 선택</h3><div class="dayPickerGrid" id="dayPickerGrid"></div><button class="btn outline" id="dayPickerCancel" type="button">취소</button></div></div>
<div class="backdrop center" id="customPlaceBackdrop" aria-hidden="true"><form class="customPlaceForm" id="customPlaceForm"><div class="detailTop"><div><span class="tag">내 장소</span><h2>내 장소 추가</h2></div><button class="close" id="customPlaceClose" type="button" aria-label="닫기">×</button></div><p class="subtle">장소명과 정확한 주소를 입력하면 주소를 좌표로 변환해 이동시간 계산에 사용합니다.</p><label>장소명 <span class="required">필수</span><input id="customName" required maxlength="80" placeholder="예: 가고 싶은 카페 이름"></label><label>정확한 주소 <span class="required">필수</span><input id="customAddress" required maxlength="180" placeholder="예: 福岡県福岡市博多区○○1-2-3"></label><div class="customPlaceGrid"><label>분류<select id="customCategory"><option value="spot">관광지</option><option value="restaurant">음식점</option><option value="shopping">쇼핑몰</option></select></label><label>예상 체류<select id="customStay"><option>30~60분</option><option selected>1~2시간</option><option>2~3시간</option><option>반일</option></select></label></div><label>메모 <span class="optional">선택</span><textarea id="customSummary" maxlength="240" placeholder="가족에게 필요한 정보나 방문 이유를 적어두세요."></textarea><span class="formHint">주소 확인 후 입력한 장소의 좌표를 저장합니다. 지도 검색 링크도 함께 생성됩니다.</span></label><p class="customPlaceStatus" id="customPlaceStatus" role="status"></p><div class="detailFooter"><button class="btn outline" id="customPlaceCancel" type="button">취소</button><button class="btn primary" id="customPlaceSubmit" type="submit">주소 확인 후 저장</button></div></form></div>
<script>
const S=(id,name,area,summary,grade='B',visitor='둘 다 인기',longWalk=false,adult=null,child=null,stay='1~2시간',hours='여행일 확인 필요',closed='여행일 확인 필요',address='후쿠오카 권역')=>({id,name,category:'spot',area,summary,grade,visitor,longWalk,adult,child,stay,hours,closed,address,transport:{taxi:'확인 필요',public:'확인 필요',walk:'도보 포함 확인 필요'},description:summary,reason:'가족 여행 후보로 선별된 장소입니다.',tips:'방문 전 운영시간·휴무·예약 여부를 확인하세요.',familyNotes:longWalk?'긴 보행·계단 또는 야외 이동에 주의하세요.':'적당한 체류와 휴식이 가능한 후보입니다.',map:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`,urls:[{label:'지도 검색',url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`}],feeStatus:adult===null?'요금 확인 필요':familyFee(adult,child),sourceStatus:'검증 출처는 프로젝트 문서 기준',coordinates:areaPoint(area)});
const R=(id,name,area,cuisine,summary,grade='B',visitor='둘 다 인기',wait='20분 초과 가능',meal='45~75분')=>({id,name,category:'restaurant',area,cuisine,summary,grade,visitor,longWalk:false,stay:meal,hours:'지점·여행일 확인 필요',closed:'지점·여행일 확인 필요',address:'지점 주소 확인 필요',transport:{taxi:'확인 필요',public:'확인 필요',walk:'도보 포함 확인 필요'},description:summary,reason:'음식 종류와 권역 분산을 고려해 선별된 후보입니다.',tips:'대기·예약·좌석을 방문 당일 확인하세요.',familyNotes:'아이 메뉴는 필수가 아니며 좌석·흡연 여부를 확인하세요.',map:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`,urls:[{label:'지도 검색',url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`}],wait,reservation:wait.includes('예약')?'예약 권장':'현장 확인',cuisine,meal,feeStatus:'가격표 미표시',sourceStatus:'검증 출처는 프로젝트 문서 기준',coordinates:areaPoint(area)});
function familyFee(adult,child){if(adult===0&&child===0)return{yen:0,krw:0,label:'무료'};if(adult==null)return{yen:null,krw:null,label:'요금 확인 필요'};const yen=adult*2+(child??adult)*2;return{yen,krw:Math.round(yen*9.3),label:`¥${yen.toLocaleString()} / 약 ${Math.round(yen*9.3).toLocaleString()}원`}}
function taxiFare(d){const yen=Math.round((680+Math.max(0,d-1.6)*(90/0.297))/10)*10;return{yen,krw:Math.round(yen*9.3)}}
function taxiFareLabel(d){const f=taxiFare(d);return`평균 ¥${f.yen.toLocaleString()} / 약 ${f.krw.toLocaleString()}원`}
function visitorLabel(v){return v==='둘 다 인기'?'한국인 관광객·현지인 모두 인기':v}

function filtered(){const q=state.query.trim().toLowerCase();return places.filter(p=>(state.cat==='all'||p.category===state.cat)&&(state.area==='all'||p.area===state.area)&&(state.grade==='all'||p.grade===state.grade)&&(!q||[p.name,p.area,p.summary,p.cuisine,p.visitor].join(' ').toLowerCase().includes(q))).sort((a,b)=>gradeRank(b.grade)-gradeRank(a.grade))}
function categoryLabel(p){return p.category==='restaurant'?'음식점':p.category==='shopping'?'쇼핑몰':'관광지'}
function card(p){const food=p.category==='restaurant',shopping=p.category==='shopping';const est=estimateFromHakata(p);return`<article class="card" draggable="true" data-drag="${p.id}"><div class="cardTop"><div><span class="tag${food?' food':shopping?' shopping':''}">${categoryLabel(p)}</span><h3>${esc(p.name)}</h3></div><span class="grade ${p.grade==='D'?'more':''}">${esc(p.grade)}${p.grade==='D'?' · 더많은장소':''}</span></div><p class="summary">${esc(p.summary)}</p><div class="meta"><span>⌖ ${esc(p.area)}</span><span>🚕 ${esc(est.taxi)}</span><span>🚌 ${esc(est.pub)}</span><span>${food?'예상 식사시간':'예상 체류시간'} ${esc(p.stay)}</span></div><div class="meta" style="margin-top:6px"><span>${food?'🍽️ '+esc(p.cuisine):shopping?'🛍️ 가족 쇼핑 후보':'🎟️ '+yen(p.feeStatus)}</span><span>${esc(visitorLabel(p.visitor))}</span></div>${p.wait?`<div class="note">대기: ${esc(p.wait)} · ${esc(p.reservation)}</div>`:''}${p.longWalk?'<div class="note">⚠ 긴 보행·계단·야외 이동 확인</div>':''}<div class="actions"><button type="button" data-detail="${p.id}">상세보기</button><button type="button" class="add" data-add="${p.id}">${scheduled(p.id)?'✓ 일정에 배치됨':'날짜에 배치'}</button></div></article>`}
function renderPlaces(){const list=filtered();$('#placeCount').textContent=`${list.length}개 / 전체 ${places.length}개`;$('#placeList').innerHTML=list.length?list.map(card).join(''):'<div class="emptyList">조건에 맞는 후보가 없습니다.</div>';bindPlaces()}
const DAY_START={'day-1':{label:'하카타역(렌터카 픽업)',point:areaPoint('하카타역'),mode:'car'},'day-2':{label:'벳푸 숙소(체크아웃)',point:areaPoint('벳푸'),mode:'car'}};
function dayStart(day){return DAY_START[day]||{label:'하카타역',point:areaPoint('하카타역'),mode:'transit'}}
function carDriveLabel(d){const mins=Math.max(10,Math.round(d/65*60/10)*10);const h=Math.floor(mins/60),m=mins%60;return h?`약 ${h}시간${m?` ${m}분`:''}`:`약 ${m}분`}
function route(day,id){const ids=state.schedule[day],i=ids.indexOf(id);const b=get(id);if(!b)return'';const a=i<=0?null:get(ids[i-1]);const start=dayStart(day);if(!a&&start.mode==='car'){const d=distance(start.point,b.coordinates);return`<div class="route">🚗 ${esc(start.label)} → ${esc(b.name)} · 약 ${d.toFixed(0)}km · 렌터카 이동 ${carDriveLabel(d)}(고속도로 기준, 실제 교통상황에 따라 다름)</div>`}const origin=a?a.coordinates:start.point;const originLabel=a?a.name:start.label;const d=distance(origin,b.coordinates);const taxi=Math.max(5,Math.round(d/0.38)+4),pub=Math.max(8,Math.round(d/0.23)+8);return`<div class="route">↳ ${esc(originLabel)} → ${esc(b.name)} · 예상 ${d.toFixed(1)}km · 택시 ${taxi}분(${taxiFareLabel(d)}) · 대중교통(도보 포함) ${pub}분</div>`}
function distance(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return Math.max(.1,6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.25)}
function returnRoute(dayId){const ids=state.schedule[dayId];if(!ids.length)return'';const last=get(ids[ids.length-1]);if(!last)return'';if(dayId==='day-1')return'<div class="route">🛌 이날은 벳푸 숙박 · 하카타로 복귀하지 않습니다</div>';const hakata=areaPoint('하카타역');const d=distance(last.coordinates,hakata);const taxi=Math.max(5,Math.round(d/0.38)+4);const pub=Math.max(8,Math.round(d/0.23)+8);return`<div class="route">↩ 마지막 일정 → 하카타역 · 예상 ${d.toFixed(1)}km · 택시 ${taxi}분(${taxiFareLabel(d)}) · 대중교통(도보 포함) ${pub}분</div>`}
function renderSchedule(){const total=Object.values(state.schedule).flat().length;$('#scheduleCount').textContent=`${total}개 배치`;const mc=$('#mobileScheduleCount');if(mc)mc.textContent=total?`(${total})`:'';$('#scheduleBoard').innerHTML=days.map(d=>{const arr=state.schedule[d.id];const html=arr.map((id,idx)=>{const p=get(id);if(!p)return'';const note=noteFor(id);return`${route(d.id,id)}<div class="scheduleCard" data-sid="${id}" data-day="${d.id}"><div class="reorder"><span class="grip" data-grip="${id}" aria-hidden="true">⠿</span><button class="icon small" data-moveup="${id}" data-day="${d.id}" aria-label="위로 이동" ${idx===0?'disabled':''}>▲</button><button class="icon small" data-movedown="${id}" data-day="${d.id}" aria-label="아래로 이동" ${idx===arr.length-1?'disabled':''}>▼</button></div><div><strong>${esc(p.name)}</strong><small>${p.category==='restaurant'?'음식점 · 예상 식사시간':p.category==='shopping'?'쇼핑몰 · 예상 체류시간':'관광지 · 예상 체류시간'} ${esc(p.stay)}</small>${note?`<div class="scheduleNote">📝 ${esc(note)}</div>`:''}<button type="button" class="noteToggle" data-note-toggle="${id}">${note?'메모 수정':'메모 추가'}</button><div class="memoEditor" data-memo-editor="${id}"><textarea data-note-input="${id}" aria-label="${esc(p.name)} 메모">${esc(note)}</textarea><div class="memoActions"><button type="button" class="saveNote" data-note-save="${id}">저장</button><button type="button" data-note-cancel="${id}">취소</button>${note?`<button type="button" data-note-delete="${id}">삭제</button>`:''}</div></div></div><button class="icon" data-remove="${id}" data-day="${d.id}" aria-label="삭제">×</button></div>`}).join('');return`<section class="day" data-day="${d.id}"><div class="dayHead"><strong>${d.label}</strong><span>${d.note}</span></div><div class="dayBody">${html||'<div class="empty">후보를 이곳에<br>끌어다 놓으세요</div>'}${returnRoute(d.id)}</div></section>`}).join('');bindSchedule()}
function sourceLinks(p){const query=encodeURIComponent(`${p.name} ${p.area} 후쿠오카`);const list=Array.isArray(p.urls)?p.urls.filter(u=>u&&u.url):[];if(!list.length)list.push({label:'Google 검색',url:`https://www.google.com/search?q=${query}`},{label:'지도 검색',url:p.map});else if(list.length===1)list.push({label:'Google 검색',url:`https://www.google.com/search?q=${query}`});const travelUrl=`https://www.tripadvisor.com/Search?q=${query}`;if(!list.some(u=>u.url===travelUrl))list.push({label:'Tripadvisor 여행 후기',url:travelUrl});return list.map(u=>`<li><a href="${u.url}" target="_blank" rel="noreferrer">↗ ${esc(u.label)}</a></li>`).join('')}
function openDetail(id){const p=get(id);if(!p)return;state.selected=id;const food=p.category==='restaurant',shopping=p.category==='shopping';const links=sourceLinks(p);const est=estimateFromHakata(p);$('#detail').innerHTML=`<div class="detailTop"><div><span class="tag${food?' food':shopping?' shopping':''}">${categoryLabel(p)}</span><h2>${esc(p.name)}</h2><p class="subtle">${esc(p.area)} · ${esc(visitorLabel(p.visitor))}</p></div><button class="close" id="close" type="button">×</button></div><p class="lead">${esc(p.description)}</p><div class="grid"><div class="item"><small>하카타역 기준</small><strong>택시 ${esc(est.taxi)}<br>대중교통 ${esc(est.pub)}</strong></div><div class="item"><small>예상 체류/식사</small><strong>${esc(p.stay)}</strong></div></div><div class="section"><h3>추천 이유</h3><p>${esc(p.reason)}</p></div><div class="section"><h3>방문 팁</h3><p>${esc(p.tips)}</p></div><div class="section"><h3>가족 적합성 · ${esc(p.grade)}${p.grade==='D'?' · 더많은장소':''}</h3><p>${esc(p.familyNotes)}</p></div>${food?`<div class="section"><h3>음식점 정보</h3><p>종류: ${esc(p.cuisine)} · 대기: ${esc(p.wait)} · ${esc(p.reservation)}</p></div>`:shopping?`<div class="section"><h3>쇼핑몰 정보</h3><p>가족 쇼핑 후보 · 식사·휴식·매장 구성은 방문 전 확인하세요.</p></div>`:`<div class="section"><h3>관광지 입장료</h3><p>${yen(p.feeStatus)} · 성인 2명·어린이 2명 기준</p></div>`}<div class="section"><h3>주소</h3><p>${esc(p.address)}</p></div><div class="section"><h3>소개 URL</h3><ul class="sources">${links||'<li>확인 필요</li>'}</ul></div><div class="detailFooter"><button class="btn primary" id="detailAdd" type="button">날짜에 배치</button><a class="btn outline" href="${p.map}" target="_blank" rel="noreferrer">지도 열기</a></div>`;$('#backdrop').classList.add('open');$('#backdrop').setAttribute('aria-hidden','false');$('#close').onclick=closeDetail;$('#detailAdd').onclick=()=>openDayPicker(id)}
function closeDetail(){$('#backdrop').classList.remove('open');$('#backdrop').setAttribute('aria-hidden','true');state.selected=null}function notice(t){const n=$('#notice');n.textContent=t;n.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>n.classList.remove('show'),2600)}function openDayPicker(id){const p=get(id);if(!p)return;$('#dayPickerTitle').textContent=`${p.name} — 배치할 날짜를 선택하세요`;$('#dayPickerGrid').innerHTML=days.map(d=>`<button type="button" data-pickday="${d.id}">${d.label}<small>${esc(d.note)}</small></button>`).join('');document.querySelectorAll('[data-pickday]').forEach(b=>b.onclick=()=>{placeAt(id,b.dataset.pickday);closeDayPicker()});$('#dayPickerBackdrop').classList.add('open');$('#dayPickerBackdrop').setAttribute('aria-hidden','false')}

function moveWithinDay(day,id,dir){const arr=state.schedule[day];const i=arr.indexOf(id);if(i<0)return;const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];renderSchedule();save()}

function beginCardDrag(id,sourceEl,e){let ghost=null,dragging=false;const startX=e.clientX,startY=e.clientY,pid=e.pointerId;try{sourceEl.setPointerCapture(pid)}catch(err){}const onMove=ev=>{const dx=ev.clientX-startX,dy=ev.clientY-startY;if(!dragging){if(Math.hypot(dx,dy)<6)return;dragging=true;const card=sourceEl.closest('.scheduleCard');if(card)card.classList.add('dragSource');ghost=document.createElement('div');ghost.className='dragGhost';ghost.textContent=`📍 ${get(id)?get(id).name:''}`;document.body.appendChild(ghost)}if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'}document.querySelectorAll('.day').forEach(d=>d.classList.remove('drop'));const under=document.elementFromPoint(ev.clientX,ev.clientY);const dayEl=under&&under.closest('.day');if(dayEl)dayEl.classList.add('drop')};const onUp=ev=>{document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onUp);try{sourceEl.releasePointerCapture(pid)}catch(err){}const card=sourceEl.closest('.scheduleCard');if(card)card.classList.remove('dragSource');document.querySelectorAll('.day').forEach(d=>d.classList.remove('drop'));if(ghost){ghost.remove();ghost=null}if(dragging){const under=document.elementFromPoint(ev.clientX,ev.clientY);const dayEl=under&&under.closest('.day');if(dayEl){const currentDay=Object.keys(state.schedule).find(d=>state.schedule[d].includes(id));if(dayEl.dataset.day!==currentDay)placeAt(id,dayEl.dataset.day)}const suppressClick=ce=>{ce.stopPropagation();ce.preventDefault()};document.addEventListener('click',suppressClick,{capture:true,once:true})}dragging=false};document.addEventListener('pointermove',onMove);document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onUp)}
function bindScheduleDrag(){document.querySelectorAll('[data-grip]').forEach(g=>{g.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;beginCardDrag(g.dataset.grip,g,e)}});document.querySelectorAll('.scheduleCard').forEach(card=>{card.onpointerdown=e=>{if(e.pointerType!=='mouse'||e.button!==0)return;if(e.target.closest('[data-grip],[data-moveup],[data-movedown],[data-remove]'))return;beginCardDrag(card.dataset.sid,card,e)}})}

function init(){document.querySelectorAll('[data-mobiletab]').forEach(b=>b.onclick=()=>setMobileTab(b.dataset.mobiletab));setMobileTab('places');syncTopbarHeight();window.addEventListener('resize',syncTopbarHeight);[...new Set(places.map(p=>p.area))].sort().forEach(a=>$('#area').insertAdjacentHTML('beforeend',`<option value="${esc(a)}">${esc(a)}</option>`));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));renderPlaces()});$('#search').oninput=e=>{state.query=e.target.value;renderPlaces()};$('#area').onchange=e=>{state.area=e.target.value;renderPlaces()};$('#grade').onchange=e=>{state.grade=e.target.value;renderPlaces()};$('#reset').onclick=()=>{if(!confirm('배치한 일정을 모두 초기화할까요?'))return;days.forEach(d=>state.schedule[d.id]=[]);renderSchedule();renderPlaces();save();notice('일정을 초기화했습니다.')};$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeDetail()};$('#dayPickerBackdrop').onclick=e=>{if(e.target.id==='dayPickerBackdrop')closeDayPicker()};$('#dayPickerCancel').onclick=closeDayPicker;document.onkeydown=e=>{if(e.key==='Escape'){closeDetail();closeDayPicker()}};restore();$('#search').value=state.query;$('#area').value=state.area;$('#grade').value=state.grade;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===state.cat));renderPlaces();renderSchedule();save()}init();

  stored.forEach(p=>{p.grade='E';p.visitor='내가 추가한 장소';p.familyNotes='E · 내가 추가한 장소입니다. 가족 여행 적합성과 운영정보를 직접 확인하세요.'});
  GRADE_RANK.E=0;
  if(![...$('#grade').options].some(o=>o.value==='E'))$('#grade').insertAdjacentHTML('beforeend','<option value="E">E · 내가 추가한 장소</option>');
  stored.forEach(p=>{if(!places.some(x=>x.id===p.id)){places.push(p);customIds.add(p.id)}});
  try{const saved=JSON.parse(localStorage.getItem('fukuoka-family-trip-v1'));if(saved?.schedule)days.forEach(d=>state.schedule[d.id]=Array.isArray(saved.schedule[d.id])?saved.schedule[d.id].filter(id=>get(id)):[])}catch(e){}
  const persistCustom=()=>localStorage.setItem(customKey,JSON.stringify(places.filter(p=>customIds.has(p.id))));
  const baseSave=save;
  save=function(){baseSave();try{persistCustom()}catch(e){}};
  const addAreaOption=area=>{if(!area||[...$('#area').options].some(o=>o.value===area))$('#area').insertAdjacentHTML('beforeend',`<option value="${esc(area)}">${esc(area)}</option>`)};
  stored.forEach(p=>addAreaOption(p.area));
  const modal=$('#customPlaceBackdrop'), form=$('#customPlaceForm');
  const close=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');form.reset()};
  $('#addPlace').onclick=()=>{modal.classList.add('open');modal.setAttribute('aria-hidden','false');setTimeout(()=>$('#customName').focus(),0)};
  $('#customPlaceClose').onclick=close;$('#customPlaceCancel').onclick=close;
  modal.onclick=e=>{if(e.target===modal)close()};
  form.onsubmit=e=>{e.preventDefault();const raw={name:$('#customName').value.trim(),address:$('#customAddress').value.trim(),category:$('#customCategory').value,stay:$('#customStay').value,summary:$('#customSummary').value.trim()};if(!raw.name||!raw.address)return;const duplicate=places.find(p=>normalizeName(p.name)===normalizeName(raw.name)&&normalizeName(p.area)===normalizeName(raw.address));if(duplicate){close();notice('같은 장소가 이미 후보 목록에 있습니다.');openDetail(duplicate.id);return}const p=addCustomPlace(raw);places.push(p);customIds.add(p.id);addAreaOption(p.area);state.cat='all';state.area='all';state.grade='all';document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat==='all'));$('#area').value='all';$('#grade').value='all';renderPlaces();renderSchedule();save();close();notice(`${p.name}을(를) 내 장소로 추가했습니다.`)};
  const geocodeAddress=async(raw)=>{
    const query=encodeURIComponent(`${raw.address}, Japan`);
    const response=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&accept-language=ja,en&q=${query}`);
    if(!response.ok)throw new Error('geocoding failed');
    const results=await response.json();
    if(!results.length)throw new Error('address not found');
    return {lat:Number(results[0].lat),lng:Number(results[0].lon)};
  };
  form.onsubmit=async e=>{
    e.preventDefault();
    const submit=$('#customPlaceSubmit'),status=$('#customPlaceStatus');
    const raw={name:$('#customName').value.trim(),address:$('#customAddress').value.trim(),category:$('#customCategory').value,stay:$('#customStay').value,summary:$('#customSummary').value.trim()};
    if(!raw.name||!raw.address)return;
    const duplicate=places.find(p=>normalizeName(p.name)===normalizeName(raw.name)&&normalizeName(p.address)===normalizeName(raw.address));
    if(duplicate){close();notice('같은 장소가 이미 후보 목록에 있습니다.');openDetail(duplicate.id);return}
    submit.disabled=true;status.classList.remove('error');status.textContent='주소 위치를 확인하는 중입니다…';
    try{
      raw.coordinates=await geocodeAddress(raw);
      const p=addCustomPlace(raw);places.push(p);customIds.add(p.id);addAreaOption(p.area);
      state.cat='all';state.area='all';state.grade='all';document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat==='all'));$('#area').value='all';$('#grade').value='all';
      renderPlaces();renderSchedule();save();close();notice(`${p.name}을(를) 정확한 주소 기준으로 추가했습니다.`);
    }catch(err){status.classList.add('error');status.textContent='주소를 찾지 못했습니다. 일본어 주소 또는 우편번호를 포함한 정확한 주소로 다시 입력해 주세요.'}
    finally{submit.disabled=false}
  };
  form.addEventListener('submit',()=>setTimeout(()=>{const mine=places.filter(p=>p.visitor==='내가 추가한 장소');mine.forEach(p=>{p.grade='E';p.familyNotes='E · 내가 추가한 장소입니다. 가족 여행 적합성과 운영정보를 직접 확인하세요.'});if(mine.length){save();renderPlaces();renderSchedule()}},0));
  const oldKeydown=document.onkeydown;document.onkeydown=e=>{if(e.key==='Escape'){close();closeDetail();closeDayPicker()}else if(oldKeydown)oldKeydown(e)};
  const baseCard=card;card=function(p){const html=baseCard(p);return p.grade==='E'?html.replace(/class="grade"/,'class="grade mine"').replace(/>E<\/span>/,'>E · 내가 추가한 장소<\/span>'):html};
  const baseOpenDetail=openDetail;openDetail=function(id){baseOpenDetail(id);const p=get(id);if(p?.grade==='E')document.querySelectorAll('#detail h3').forEach(h=>{if(h.textContent.includes('가족 적합성')&&!h.textContent.includes('내가 추가한 장소'))h.textContent+=' · 내가 추가한 장소'})};
  const relabelAsShopping=['캐널시티','JR 하카타시티','라라포트','텐진 지하상가','니시진 상점가','카와바타 상점가'];
  places.forEach(p=>{if(relabelAsShopping.some(token=>p.name.toLowerCase().includes(token.toLowerCase())))p.category='shopping'});
  const duplicateVenueGroups=[['라라포트·실물','LaLaport FUKUOKA'],['JR 하카타시티','JR 하카타 시티·아뮤플라자 하카타']];
  duplicateVenueGroups.forEach(group=>{const matches=places.filter(p=>group.some(token=>p.name.toLowerCase().includes(token.toLowerCase())));if(matches.length>1){const keeper=matches.find(p=>p.id.startsWith('FUK-'))||matches[0];matches.filter(p=>p!==keeper).forEach(p=>{const i=places.indexOf(p);if(i>=0)places.splice(i,1)})}});
  const shoppingMeta={'후쿠오카PARCO':{address:'福岡県福岡市中央区天神2-11-1'},'ONEFUKUOKABLDG.':{address:'福岡県福岡市中央区天神1-11-1'},'VIORO':{address:'福岡県福岡市中央区天神2-10-3'},'미나텐진':{address:'福岡県福岡市中央区天神4-3-8'},'이와타야본점':{address:'福岡県福岡市中央区天神2-5-35'},'후쿠오카미츠코시':{address:'福岡県福岡市中央区天神2-1-1'},'다이마루후쿠오카텐진점':{address:'福岡県福岡市中央区天神1-4-1'},'하카타한큐':{address:'福岡県福岡市博多区博多駅中央街1-1'},'KITTE하카타':{address:'福岡県福岡市博多区博多駅中央街9-1'},'토스프리미엄아울렛':{address:'佐賀県鳥栖市弥生が丘8-1'}};
  places.forEach(p=>{const meta=shoppingMeta[normalizeName(p.name)];if(meta){p.address=meta.address;p.sourceStatus='공식 매장 목록 확인 · 최근 방문 후기 검토 완료'}});
  const shoppingBrandNotes=[
    ['캐널시티','ASICS·Levi’s·ABC-MART·UNIQLO'],['LaLaport','UNIQLO·GU·ABC-MART·GAP'],['라라포트','UNIQLO·GU·ABC-MART·GAP'],['JR 하카타시티','BEAMS·MUJI·東急ハンズ·ABC-MART'],['JR 하카타 시티','BEAMS·MUJI·東急ハンズ·ABC-MART'],['리버레인','Zoff·ABC-MART·지역 편집숍'],['MARK IS','UNIQLO·GU·ABC-MART·ニトリ'],['솔라리아','ESTNATION·Maison Margiela·MILKFED.'],['텐진 지하상가','LUSH·PLAZA·Zoff·ABC-MART'],['베이사이드','지역 기념품점·식음 매장·생활잡화점'],['이온몰 후쿠오카','UNIQLO·GU·ABC-MART·H&M'],['키노하 몰','UNIQLO·GU·ABC-MART·NITORI'],['Standard Products','Standard Products·DAISO·THREEPPY'],['니시진 상점가','지역 상점·식료품점·생활잡화점'],['카와바타 상점가',' 지역 전통 상점·과자점·기념품점']
  ];
  places.filter(p=>p.category==='shopping').forEach(p=>{const hit=shoppingBrandNotes.find(([token])=>p.name.includes(token));if(hit&&!p.summary.includes('대표 브랜드'))p.summary=`${p.summary} 대표 브랜드·매장 예시: ${hit[1]} (입점·영업 여부는 방문 전 공식 목록 확인)`;p.description=p.summary});
  renderPlaces();renderSchedule();
})();
</script></body></html>
