<style>

kground:var(--blueSoft)}.mapItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px dashed #aac5dc;border-radius:11px;background:#f4faff}.mapItem strong{display:block;font-size:.84rem}.mapItem span{display:block;margin-top:3px;color:var(--muted);font-size:.7rem}.schedule{overflow:hidden}.scheduleHead{align-items:center}.scheduleBoard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:10px 21px 21px}.day{min-height:190px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;transition:.15s}.day.drop{border-color:var(--blue);background:#f1f8ff;box-shadow:inset 0 0 0 2px #2778c81c}.dayHead{display:flex;justify-content:space-between;gap:5px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}.dayHead strong{font-size:.84rem}.dayHead span{color:var(--muted);font-size:.65rem}.dayBody{display:grid;gap:7px;padding:9px;min-height:135px}.empty{display:grid;place-items:center;min-height:115px;color:#8a97a4;text-align:center;font-size:.72rem;line-height:1.5}.scheduleCard{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:8px;border:1px solid #d8e1ea;border-radius:9px;background:#fff;cursor:pointer;transition:.15s}.scheduleCard:hover{border-color:#8ec1ed;box-shadow:0 6px 16px #2778c81c}.scheduleCard .grip{color:#93a3b3;cursor:grab;touch-action:none;user-select:none;display:block;text-align:center;font-size:.72rem;line-height:1}.scheduleCard.dragSource{opacity:.4}.dragGhost{position:fixed;z-index:50;pointer-events:none;padding:8px 10px;border-radius:9px;background:#fff;border:1px solid #8ec1ed;box-shadow:0 10px 24px #18324a33;font-size:.74rem;font-weight:800;color:var(--navy);transform:translate(-50%,-50%);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scheduleCard strong{display:block;font-size:.74rem}.scheduleCard small{display:block;margin-top:2px;color:var(--muted);font-size:.64rem}.icon{border:0;color:#7b8997;background:transparent;font-size:1rem}.reorder{display:flex;flex-direction:column;gap:2px}.icon.small{font-size:1.15rem;padding:4px 8px;line-height:1;border-radius:6px}.icon.small:not(:disabled):hover{background:#eef3f8}.icon:disabled{opacity:.25;cursor:default}.backdrop.center{justify-content:center;align-items:center}.dayPicker{width:min(360px,92vw);padding:20px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}.dayPicker h3{margin:0 0 14px;font-size:1rem}.dayPickerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.dayPickerGrid button{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;font-weight:800;text-align:left}.dayPickerGrid button:hover{border-color:#8ec1ed;background:var(--blueSoft)}.dayPickerGrid button small{display:block;color:var(--muted);font-weight:600;font-size:.7rem;margin-top:2px}.route{margin:0 3px -2px;padding:4px 6px;border-left:2px solid #9ac7ea;color:#52728d;font-size:.64rem;line-height:1.35}.notice{display:none;margin:0 21px 15px;padding:9px 11px;border-radius:9px;color:#24547b;background:#edf7ff;font-size:.77rem}.notice.show{display:block}.emptyList{padding:25px 8px;color:var(--muted);text-align:center;font-size:.82rem;line-height:1.5}.backdrop{position:fixed;inset:0;z-index:30;display:none;justify-content:flex-end;background:#0a192661}.backdrop.open{display:flex}.detail{width:min(480px,100%);height:100%;overflow:auto;padding:24px;background:#fff;box-shadow:-15px 0 45px #18324a2e}.detailTop{display:flex;justify-content:space-between;gap:10px}.detailTop h2{margin:9px 0 4px;font-size:1.38rem;letter-spacing:-.04em}.close{border:0;color:var(--muted);background:transparent;font-size:1.5rem}.lead{margin:17px 0;color:#526170;line-height:1.65;font-size:.85rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.item{padding:10px;border-radius:9px;background:#f6f8fa}.item small{display:block;margin-bottom:4px;color:var(--muted);font-size:.67rem}.item strong{font-size:.78rem;line-height:1.35}.section{margin:18px 0}.section h3{margin-bottom:7px;font-size:.87rem}.section p,.section li{color:#526170;font-size:.8rem;line-height:1.6}.sources{display:grid;gap:6px;padding:0;list-style:none}.sources a{color:var(--blue);font-size:.78rem;text-decoration:none}.detailFooter{display:flex;gap:8px;margin-top:22px}.detailFooter>*{flex:1;text-align:center;text-decoration:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1080px){.layout{grid-template-columns:1fr}.placeList{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}.topActions{width:100%;justify-content:space-between}.layout{padding:13px 10px 32px}.panelHead,.tabs,.controls,.views,.placeList,.mapList,.scheduleBoard{padding-left:15px;padding-right:15px}.placeList{grid-template-columns:1fr}.scheduleBoard{grid-template-columns:repeat(6,minmax(205px,1fr));overflow-x:auto}.scheduleHead{align-items:flex-start;flex-direction:column}.detail{padding:19px}}
</style>

<body>
<div class="app"><header class="topbar"><div><p class="eyebrow">FUKUOKA FAMILY TRIP · FINAL PLANNER</p><h1>냥아♡ 후쿠오카 가자</h1></div><div class="topActions"><span class="saveState" id="saveState">● 저장 준비</span><button class="btn ghost" id="reset" type="button">일정 초기화</button><span class="appVersion" title="현재 배포 버전">v0.99</span></div></header>
<div class="mobileTabs" role="tablist"><button class="mobileTab active" data-mobiletab="places" type="button">후보 탐색</button><button class="mobileTab" data-mobiletab="schedule" type="button">일정 보기 <span id="mobileScheduleCount"></span></button></div>
<main class="layout"><section class="panel" id="placesPanel"><div class="panelHead"><div><h2>후보 탐색</h2><p class="subtle">날짜와 관계없이 후보를 먼저 고른 뒤 원하는 날짜에 배치하세요. 가족등급 높은순(A→D)으로 정렬됩니다.</p></div><span class="pill" id="placeCount">0개</span></div><div class="tabs"><button class="tab active" data-cat="all">전체</button><button class="tab" data-cat="spot">관광지</button><button class="tab" data-cat="restaurant">음식점</button><button class="tab" data-cat="shopping">쇼핑몰</button></div><div class="controls"><label class="sr" for="search">검색</label><input class="search" id="search" type="search" placeholder="장소명·지역·음식 종류 검색"><label class="sr" for="area">지역</label><select id="area"><option value="all">전체 지역</option></select><label class="sr" for="grade">가족등급</label><select id="grade"><option value="all">가족등급 전체</option><option value="A">A 적극추천</option><option value="A/B">A/B 조건부 추천</option><option value="B">B 추천</option><option value="C">C 조건부</option><option value="D">D 더많은장소</option></select></div><div class="placeList" id="placeList"></div></section>
<section class="panel schedule" id="schedulePanel"><div class="panelHead scheduleHead"><div><h2>5박 6일 일정</h2><p class="subtle">후보를 끌어다 놓거나 카드의 날짜 배치 버튼을 사용하세요. DAY 1은 벳푸 이동, DAY 2는 차량 반납·하카타 전환 기준입니다.</p></div><span class="pill" id="scheduleCount">0개 배치</span></div><div class="notice" id="notice" role="status"></div><div class="scheduleBoard" id="scheduleBoard"></div></section></main></div>
<div class="backdrop" id="backdrop" aria-hidden="true"><aside class="detail" role="dialog" aria-modal="true"><div id="detail"></div></aside></div>
<div class="backdrop center" id="dayPickerBackdrop" aria-hidden="true"><div class="dayPicker" role="dialog" aria-modal="true"><h3 id="dayPickerTitle">날짜 선택</h3><div class="dayPickerGrid" id="dayPickerGrid"></div><button class="btn outline" id="dayPickerCancel" type="button">취소</button></div></div>
<script>
const S=(id,name,area,summary,grade='B',visitor='둘 다 인기',longWalk=false,adult=null,child=null,stay='1~2시간',hours='여행일 확인 필요',closed='여행일 확인 필요',address='후쿠오카 권역')=>({id,name,category:'spot',area,summary,grade,visitor,longWalk,adult,child,stay,hours,closed,address,transport:{taxi:'확인 필요',public:'확인 필요',walk:'도보 포함 확인 필요'},description:summary,reason:'가족 여행 후보로 선별된 장소입니다.',tips:'방문 전 운영시간·휴무·예약 여부를 확인하세요.',familyNotes:longWalk?'긴 보행·계단 또는 야외 이동에 주의하세요.':'적당한 체류와 휴식이 가능한 후보입니다.',map:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`,urls:[{label:'지도 검색',url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`}],feeStatus:adult===null?'요금 확인 필요':familyFee(adult,child),sourceStatus:'검증 출처는 프로젝트 문서 기준',coordinates:areaPoint(area)});
const R=(id,name,area,cuisine,summary,grade='B',visitor='둘 다 인기',wait='20분 초과 가능',meal='45~75분')=>({id,name,category:'restaurant',area,cuisine,summary,grade,visitor,longWalk:false,stay:meal,hours:'지점·여행일 확인 필요',closed:'지점·여행일 확인 필요',address:'지점 주소 확인 필요',transport:{taxi:'확인 필요',public:'확인 필요',walk:'도보 포함 확인 필요'},description:summary,reason:'음식 종류와 권역 분산을 고려해 선별된 후보입니다.',tips:'대기·예약·좌석을 방문 당일 확인하세요.',familyNotes:'아이 메뉴는 필수가 아니며 좌석·흡연 여부를 확인하세요.',map:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`,urls:[{label:'지도 검색',url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`}],wait,reservation:wait.includes('예약')?'예약 권장':'현장 확인',cuisine,meal,feeStatus:'가격표 미표시',sourceStatus:'검증 출처는 프로젝트 문서 기준',coordinates:areaPoint(area)});
function familyFee(adult,child){if(adult===0&&child===0)return{yen:0,krw:0,label:'무료'};if(adult==null)return{yen:null,krw:null,label:'요금 확인 필요'};const yen=adult*2+(child??adult)*2;return{yen,krw:Math.round(yen*9.3),label:`¥${yen.toLocaleString()} / 약 ${Math.round(yen*9.3).toLocaleString()}원`}}
function taxiFare(d){const yen=Math.round((680+Math.max(0,d-1.6)*(90/0.297))/10)*10;return{yen,krw:Math.round(yen*9.3)}}
function taxiFareLabel(d){const f=taxiFare(d);return`평균 ¥${f.yen.toLocaleString()} / 약 ${f.krw.toLocaleString()}원`}

const baseRenderSchedule=renderSchedule;
function candidateCard(id,index){const p=get(id);if(!p)return'';return`<div class="scheduleCard" data-sid="${id}" data-day="candidates"><div class="reorder"><span class="grip" data-grip="${id}" aria-hidden="true">⠿</span><button class="icon small" data-moveup="${id}" data-day="candidates" aria-label="후보 위로 이동" ${index===0?'disabled':''}>▲</button><button class="icon small" data-movedown="${id}" data-day="candidates" aria-label="후보 아래로 이동" ${index===state.candidates.length-1?'disabled':''}>▼</button></div><div><strong>${esc(p.name)}</strong><small>${p.category==='restaurant'?'음식점':'관광지'} · ${esc(p.stay)}</small><button type="button" class="candidateMove" data-open-days="${id}">DAY에 배치</button></div><button class="icon" data-remove="${id}" data-day="candidates" aria-label="후보함에서 제거">×</button></div>`}
renderSchedule=function(){baseRenderSchedule();let pool=document.querySelector('.candidatePool');if(!pool){pool=document.createElement('section');pool.className='day candidatePool';pool.dataset.day='candidates';document.querySelector('#scheduleBoard').insertAdjacentElement('beforebegin',pool)}pool.innerHTML=`<div class="dayHead"><strong>후보함 · ${state.candidates.length}개</strong><span>DAY에 넣기 전 임시로 모아두는 장소 · 끌어서 날짜로 옮길 수 있어요</span></div><div class="dayBody candidateItems">${state.candidates.length?state.candidates.map(candidateCard).join(''):'<div class="empty">후보 탐색에서 장소를 담거나<br>DAY 일정에서 이곳으로 옮겨보세요</div>'}</div>`;document.querySelectorAll('#scheduleBoard .scheduleCard').forEach(el=>{const id=el.dataset.sid,content=el.children[1];if(content&&!content.querySelector('[data-to-candidates]')){const b=document.createElement('button');b.type='button';b.className='toCandidate';b.dataset.toCandidates=id;b.textContent='후보함으로 옮기기';b.onclick=e=>{e.preventDefault();e.stopPropagation();placeAt(id,'candidates')};content.appendChild(b)}});bindSchedule()};
function placeAt(id,target){Object.keys(state.schedule).forEach(day=>state.schedule[day]=state.schedule[day].filter(x=>x!==id));state.candidates=state.candidates.filter(x=>x!==id);if(target==='candidates')state.candidates.push(id);else if(state.schedule[target])state.schedule[target].push(id);renderSchedule();renderPlaces();save();const label=target==='candidates'?'후보함':target.replace('day-','DAY ');notice(`${get(id)?.name||'장소'}을(를) ${label}으로 옮겼습니다.`)}
function moveWithinDay(day,id,dir){const list=day==='candidates'?state.candidates:state.schedule[day];const i=list.indexOf(id),j=i+dir;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];renderSchedule();save()}
function remove(id,day){if(day==='candidates')state.candidates=state.candidates.filter(x=>x!==id);else state.schedule[day]=state.schedule[day].filter(x=>x!==id);renderSchedule();renderPlaces();save();notice(day==='candidates'?'후보함에서 뺐습니다.':'일정에서 뺐습니다.')}
const baseOpenDayPicker=openDayPicker;
openDayPicker=function(id){baseOpenDayPicker(id);$('#dayPickerGrid').insertAdjacentHTML('beforeend','<button type="button" data-pickday="candidates">후보함<small>날짜를 정하지 않고 모아두기</small></button>');document.querySelector('[data-pickday="candidates"]').onclick=()=>{placeAt(id,'candidates');closeDayPicker()}};
document.querySelector('#placeList').addEventListener('click',e=>{const b=e.target.closest('[data-candidate-toggle]');if(!b)return;e.preventDefault();e.stopPropagation();const id=b.dataset.candidateToggle;if(state.candidates.includes(id))remove(id,'candidates');else placeAt(id,'candidates')});
document.querySelector('#scheduleBoard').addEventListener('click',e=>{const b=e.target.closest('[data-open-days]');if(b){e.preventDefault();e.stopPropagation();openDayPicker(b.dataset.openDays)}});
const baseEstimateFromHakata=estimateFromHakata;
estimateFromHakata=function(p){if(p.area==='유후인'){const d=distance(LODGING_BASE.point,p.coordinates);return{taxi:`렌터카 이동 ${carDriveLabel(d)}`,pub:'유후인 구간·대중교통 확인 필요'}}return baseEstimateFromHakata(p)};
renderPlaces();renderSchedule();save();document.querySelector('.appVersion').textContent='v0.99';
document.querySelector('#schedulePanel').addEventListener('click',e=>{const b=e.target.closest('[data-open-days]');if(b){e.preventDefault();e.stopPropagation();openDayPicker(b.dataset.openDays)}},true);
document.querySelector('#schedulePanel').addEventListener('pointerdown',e=>{if(e.target.closest('[data-to-candidates],[data-open-days]'))e.stopPropagation()},true);
const currentOpenDayPicker=openDayPicker;
openDayPicker=function(id){currentOpenDayPicker(id);const p=get(id);if(p)$('#dayPickerTitle').textContent=`${p.name} — 옮길 곳을 선택하세요`};
renderPlaces();renderSchedule();save();
</script></body></html>
