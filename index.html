ound:transparent;font-weight:800}.tab.active,.viewBtn.active{color:var(--blue);border-color:#b8d8f3;background:var(--blueSoft)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 21px;background:#fbfcfe;border-bottom:1px solid var(--line)}.search{grid-column:1/-1;width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none}.search:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2778c81f}select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.views{display:flex;gap:6px;padding:12px 21px 0}.viewBtn{flex:1;border-color:var(--line);background:#fff;font-size:.78rem}.placeList,.mapList{display:grid;gap:10px;padding:15px 21px 21px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;transition:.15s}.card:hover,.card.dragging{border-color:#8ec1ed;box-shadow:0 8px 20px #2778c81c}.card.dragging{opacity:.55}.cardTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.card h3{margin:6px 0 4px;font-size:.96rem}.tag{display:inline-flex;border-radius:999px;padding:3px 7px;color:var(--blue);background:var(--blueSoft);font-size:.65rem;font-weight:800}.tag.food{color:var(--orange);background:#fff4df}.grade{display:inline-flex;border-radius:999px;padding:4px 7px;color:var(--green);background:#e6f7ef;font-size:.66rem;font-weight:800;white-space:nowrap}.summary{margin:8px 0 10px;color:#526170;font-size:.8rem;line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:.7rem;line-height:1.45}.meta strong{color:var(--ink)}.note{margin-top:8px;padding:7px 8px;border-left:2px solid #9ac7ea;color:#52728d;background:#f5faff;font-size:.7rem;line-height:1.4}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 6px;color:var(--navy);background:#fff;font-size:.72rem;font-weight:800}.actions .add{color:var(--blue);border-color:#b8d8f3;background:var(--blueSoft)}.mapItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px dashed #aac5dc;border-radius:11px;background:#f4faff}.mapItem strong{display:block;font-size:.84rem}.mapItem span{display:block;margin-top:3px;color:var(--muted);font-size:.7rem}.schedule{overflow:hidden}.scheduleHead{align-items:center}.scheduleBoard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:10px 21px 21px}.day{min-height:190px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;transition:.15s}.day.drop{border-color:var(--blue);background:#f1f8ff;box-shadow:inset 0 0 0 2px #2778c81c}.dayHead{display:flex;justify-content:space-between;gap:5px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}.dayHead strong{font-size:.84rem}.dayHead span{color:var(--muted);font-size:.65rem}.dayBody{display:grid;gap:7px;padding:9px;min-height:135px}.empty{display:grid;place-items:center;min-height:115px;color:#8a97a4;text-align:center;font-size:.72rem;line-height:1.5}.scheduleCard{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:8px;border:1px solid #d8e1ea;border-radius:9px;background:#fff}.scheduleCard .grip{color:#93a3b3;cursor:grab}.scheduleCard strong{display:block;font-size:.74rem}.scheduleCard small{display:block;margin-top:2px;color:var(--muted);font-size:.64rem}.icon{border:0;color:#7b8997;background:transparent;font-size:1rem}.route{margin:0 3px -2px;padding:4px 6px;border-left:2px solid #9ac7ea;color:#52728d;font-size:.64rem;line-height:1.35}.notice{display:none;margin:0 21px 15px;padding:9px 11px;border-radius:9px;color:#24547b;background:#edf7ff;font-size:.77rem}.notice.show{display:block}.emptyList{padding:25px 8px;color:var(--muted);text-align:center;font-size:.82rem;line-height:1.5}.backdrop{position:fixed;inset:0;z-index:30;display:none;justify-content:flex-end;background:#0a192661}.backdrop.open{display:flex}.detail{width:min(480px,100%);height:100%;overflow:auto;padding:24px;background:#fff;box-shadow:-15px 0 45px #18324a2e}.detailTop{display:flex;justify-content:space-between;gap:10px}.detailTop h2{margin:9px 0 4px;font-size:1.38rem;letter-spacing:-.04em}.close{border:0;color:var(--muted);background:transparent;font-size:1.5rem}.lead{margin:17px 0;color:#526170;line-height:1.65;font-size:.85rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.item{padding:10px;border-radius:9px;background:#f6f8fa}.item small{display:block;margin-bottom:4px;color:var(--muted);font-size:.67rem}.item strong{font-size:.78rem;line-height:1.35}.section{margin:18px 0}.section h3{margin-bottom:7px;font-size:.87rem}.section p,.section li{color:#526170;font-size:.8rem;line-height:1.6}.sources{display:grid;gap:6px;padding:0;list-style:none}.sources a{color:var(--blue);font-size:.78rem;text-decoration:none}.detailFooter{display:flex;gap:8px;margin-top:22px}.detailFooter>*{flex:1;text-align:center;text-decoration:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1080px){.layout{grid-template-columns:1fr}.placeList{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}.topActions{width:100%;justify-content:space-between}.layout{padding:13px 10px 32px}.panelHead,.tabs,.controls,.views,.placeList,.mapList,.scheduleBoard{padding-left:15px;padding-right:15px}.placeList{grid-template-columns:1fr}.scheduleBoard{grid-template-columns:repeat(6,minmax(205px,1fr));overflow-x:auto}.scheduleHead{align-items:flex-start;flex-direction:column}.detail{padding:19px}}

<div class="app"><header class="topbar"><div><p class="eyebrow">FUKUOKA FAMILY TRIP · FINAL PLANNER</p><h1>냥아♡ 후쿠오카 가자</h1></div><div class="topActions"><span class="saveState" id="saveState">● 저장 준비</span><button class="btn ghost" id="reset" type="button">일정 초기화</button></div></header>
<div class="mobileTabs" role="tablist"><button class="mobileTab active" data-mobiletab="places" type="button">후보 탐색</button><button class="mobileTab" data-mobiletab="schedule" type="button">일정 보기 <span id="mobileScheduleCount"></span></button></div>
<main class="layout"><section class="panel" id="placesPanel"><div class="panelHead"><div><h2>후보 탐색</h2><p class="subtle">날짜와 관계없이 후보를 먼저 고른 뒤 원하는 날짜에 배치하세요.</p></div><span class="pill" id="placeCount">0개</span></div><div class="tabs"><button class="tab active" data-cat="all">전체</button><button class="tab" data-cat="spot">관광지</button><button class="tab" data-cat="restaurant">음식점</button></div><div class="controls"><label class="sr" for="search">검색</label><input class="search" id="search" type="search" placeholder="장소명·지역·음식 종류 검색"><label class="sr" for="area">지역</label><select id="area"><option value="all">전체 지역</option></select><label class="sr" for="grade">가족등급</label><select id="grade"><option value="all">가족등급 전체</option><option value="A">A 적극추천</option><option value="A/B">A/B 조건부 추천</option><option value="B">B 추천</option><option value="C">C 조건부</option></select></div><div class="placeList" id="placeList"></div></section>
<section class="panel schedule" id="schedulePanel"><div class="panelHead scheduleHead"><div><h2>5박 6일 일정</h2><p class="subtle">후보를 끌어다 놓거나 카드의 날짜 배치 버튼을 사용하세요. DAY 1은 벳푸 이동, DAY 2는 차량 반납·하카타 전환 기준입니다.</p></div><span class="pill" id="scheduleCount">0개 배치</span></div><div class="notice" id="notice" role="status"></div><div class="scheduleBoard" id="scheduleBoard"></div></section></main></div>

<script>
const S=(id,name,area,summary,grade='B',visitor='둘 다 인기',longWalk=false,adult=null,child=null,stay='1~2시간',hours='여행일 확인 필요',closed='여행일 확인 필요',address='후쿠오카 권역')=>({id,name,category:'spot',area,summary,grade,visitor,longWalk,adult,child,stay,hours,closed,address,transport:{taxi:'확인 필요',public:'확인 필요',walk:'도보 포함 확인 필요'},description:summary,reason:'가족 여행 후보로 선별된 장소입니다.',tips:'방문 전 운영시간·휴무·예약 여부를 확인하세요.',familyNotes:longWalk?'긴 보행·계단 또는 야외 이동에 주의하세요.':'적당한 체류와 휴식이 가능한 후보입니다.',map:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`,urls:[{label:'지도 검색',url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`}],feeStatus:adult===null?'요금 확인 필요':familyFee(adult,child),sourceStatus:'검증 출처는 프로젝트 문서 기준',coordinates:areaPoint(area)});
const R=(id,name,area,cuisine,summary,grade='B',visitor='둘 다 인기',wait='20분 초과 가능',meal='45~75분')=>({id,name,category:'restaurant',area,cuisine,summary,grade,visitor,longWalk:false,stay:meal,hours:'지점·여행일 확인 필요',closed:'지점·여행일 확인 필요',address:'지점 주소 확인 필요',transport:{taxi:'확인 필요',public:'확인 필요',walk:'도보 포함 확인 필요'},description:summary,reason:'음식 종류와 권역 분산을 고려해 선별된 후보입니다.',tips:'대기·예약·좌석을 방문 당일 확인하세요.',familyNotes:'아이 메뉴는 필수가 아니며 좌석·흡연 여부를 확인하세요.',map:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`,urls:[{label:'지도 검색',url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+area+' Fukuoka')}`}],wait,reservation:wait.includes('예약')?'예약 권장':'현장 확인',cuisine,meal,feeStatus:'가격표 미표시',sourceStatus:'검증 출처는 프로젝트 문서 기준',coordinates:areaPoint(area)});
function familyFee(adult,child){if(adult===0&&child===0)return{yen:0,krw:0,label:'무료'};if(adult==null)return{yen:null,krw:null,label:'요금 확인 필요'};const yen=adult*2+(child??adult)*2;return{yen,krw:Math.round(yen*9.3),label:`¥${yen.toLocaleString()} / 약 ${Math.round(yen*9.3).toLocaleString()}원`}}
function taxiFare(d){const yen=Math.round((680+Math.max(0,d-1.6)*(90/0.297))/10)*10;return{yen,krw:Math.round(yen*9.3)}}
function taxiFareLabel(d){const f=taxiFare(d);return`평균 ¥${f.yen.toLocaleString()} / 약 ${f.krw.toLocaleString()}원`}
function visitorLabel(v){return v==='둘 다 인기'?'한국인 관광객·현지인 모두 인기':v}

const days=[{id:'day-1',label:'DAY 1',note:'렌터카 → 벳푸'},{id:'day-2',label:'DAY 2',note:'반납 → 하카타'},{id:'day-3',label:'DAY 3',note:'하카타 거점'},{id:'day-4',label:'DAY 4',note:'하카타 거점'},{id:'day-5',label:'DAY 5',note:'하카타 거점'},{id:'day-6',label:'DAY 6',note:'출국일'}];
const state={cat:'all',query:'',area:'all',grade:'all',selected:null,schedule:Object.fromEntries(days.map(d=>[d.id,[]]))};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const get=id=>places.find(p=>p.id===id);const scheduled=id=>Object.values(state.schedule).some(a=>a.includes(id));
function yen(f){if(!f||f.yen==null)return'요금 확인 필요';return f.yen===0?'무료':`¥${f.yen.toLocaleString()} / 약 ${f.krw.toLocaleString()}원`}
function filtered(){const q=state.query.trim().toLowerCase();return places.filter(p=>(state.cat==='all'||p.category===state.cat)&&(state.area==='all'||p.area===state.area)&&(state.grade==='all'||p.grade===state.grade)&&(!q||[p.name,p.area,p.summary,p.cuisine,p.visitor].join(' ').toLowerCase().includes(q)))}
function card(p){const food=p.category==='restaurant';return`<article class="card" draggable="true" data-drag="${p.id}"><div class="cardTop"><div><span class="tag${food?' food':''}">${food?'음식점':'관광지'}</span><h3>${esc(p.name)}</h3></div><span class="grade">${esc(p.grade)}</span></div><p class="summary">${esc(p.summary)}</p><div class="meta"><span>⌖ ${esc(p.area)}</span><span>🚕 ${esc(p.transport.taxi)}</span><span>🚌 ${esc(p.transport.public)}</span><span>${food?'예상 식사시간':'예상 체류시간'} ${esc(p.stay)}</span></div><div class="meta" style="margin-top:6px"><span>${food?'🍽️ '+esc(p.cuisine):'🎟️ '+yen(p.feeStatus)}</span><span>${esc(visitorLabel(p.visitor))}</span></div>${p.wait?`<div class="note">대기: ${esc(p.wait)} · ${esc(p.reservation)}</div>`:''}${p.longWalk?'<div class="note">⚠ 긴 보행·계단·야외 이동 확인</div>':''}<div class="actions"><button type="button" data-detail="${p.id}">상세보기</button><button type="button" class="add" data-add="${p.id}">${scheduled(p.id)?'✓ 일정에 배치됨':'날짜에 배치'}</button></div></article>`}
function renderPlaces(){const list=filtered();$('#placeCount').textContent=`${list.length}개 / 전체 ${places.length}개`;$('#placeList').innerHTML=list.length?list.map(card).join(''):'<div class="emptyList">조건에 맞는 후보가 없습니다.</div>';bindPlaces()}
const DAY_START={'day-1':{label:'하카타역(렌터카 픽업)',point:areaPoint('하카타역')},'day-2':{label:'벳푸 숙소(체크아웃)',point:areaPoint('벳푸')}};
function dayStart(day){return DAY_START[day]||{label:'하카타역',point:areaPoint('하카타역')}}
function route(day,id){const ids=state.schedule[day],i=ids.indexOf(id);const b=get(id);if(!b)return'';const a=i<=0?null:get(ids[i-1]);const start=dayStart(day);const origin=a?a.coordinates:start.point;const originLabel=a?a.name:start.label;const d=distance(origin,b.coordinates);const taxi=Math.max(5,Math.round(d/0.38)+4),pub=Math.max(8,Math.round(d/0.23)+8);return`<div class="route">↳ ${esc(originLabel)} → ${esc(b.name)} · 예상 ${d.toFixed(1)}km · 택시 ${taxi}분(${taxiFareLabel(d)}) · 대중교통(도보 포함) ${pub}분</div>`}
function distance(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return Math.max(.1,6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.25)}
function returnRoute(dayId){const ids=state.schedule[dayId];if(!ids.length)return'';const last=get(ids[ids.length-1]);if(!last)return'';if(dayId==='day-1')return'<div class="route">🛌 이날은 벳푸 숙박 · 하카타로 복귀하지 않습니다</div>';const hakata=areaPoint('하카타역');const d=distance(last.coordinates,hakata);const taxi=Math.max(5,Math.round(d/0.38)+4);const pub=Math.max(8,Math.round(d/0.23)+8);return`<div class="route">↩ 마지막 일정 → 하카타역 · 예상 ${d.toFixed(1)}km · 택시 ${taxi}분(${taxiFareLabel(d)}) · 대중교통(도보 포함) ${pub}분</div>`}
function renderSchedule(){const total=Object.values(state.schedule).flat().length;$('#scheduleCount').textContent=`${total}개 배치`;const mc=$('#mobileScheduleCount');if(mc)mc.textContent=total?`(${total})`:'';$('#scheduleBoard').innerHTML=days.map(d=>{const html=state.schedule[d.id].map(id=>{const p=get(id);return p?`${route(d.id,id)}<div class="scheduleCard" draggable="true" data-sid="${id}" data-day="${d.id}"><span class="grip">⠿</span><div><strong>${esc(p.name)}</strong><small>${p.category==='restaurant'?'음식점 · 예상 식사시간':'관광지 · 예상 체류시간'} ${esc(p.stay)}</small></div><button class="icon" data-remove="${id}" data-day="${d.id}" aria-label="삭제">×</button></div>`:''}).join('');return`<section class="day" data-day="${d.id}"><div class="dayHead"><strong>${d.label}</strong><span>${d.note}</span></div><div class="dayBody">${html||'<div class="empty">후보를 이곳에<br>끌어다 놓으세요</div>'}${returnRoute(d.id)}</div></section>`}).join('');bindSchedule()}
function sourceLinks(p){const query=encodeURIComponent(`${p.name} ${p.area} 후쿠오카`);const list=Array.isArray(p.urls)?p.urls.filter(u=>u&&u.url):[];if(!list.length)list.push({label:'Google 검색',url:`https://www.google.com/search?q=${query}`},{label:'지도 검색',url:p.map});else if(list.length===1)list.push({label:'Google 검색',url:`https://www.google.com/search?q=${query}`});const travelUrl=`https://www.tripadvisor.com/Search?q=${query}`;if(!list.some(u=>u.url===travelUrl))list.push({label:'Tripadvisor 여행 후기',url:travelUrl});return list.map(u=>`<li><a href="${u.url}" target="_blank" rel="noreferrer">↗ ${esc(u.label)}</a></li>`).join('')}
function openDetail(id){const p=get(id);if(!p)return;state.selected=id;const food=p.category==='restaurant';const links=sourceLinks(p);$('#detail').innerHTML=`<div class="detailTop"><div><span class="tag${food?' food':''}">${food?'음식점':'관광지'}</span><h2>${esc(p.name)}</h2><p class="subtle">${esc(p.area)} · ${esc(visitorLabel(p.visitor))}</p></div><button class="close" id="close" type="button">×</button></div><p class="lead">${esc(p.description)}</p><div class="grid"><div class="item"><small>하카타역 기준</small><strong>택시 ${esc(p.transport.taxi)}<br>대중교통 ${esc(p.transport.public)}</strong></div><div class="item"><small>예상 체류/식사</small><strong>${esc(p.stay)}</strong></div></div><div class="section"><h3>추천 이유</h3><p>${esc(p.reason)}</p></div><div class="section"><h3>방문 팁</h3><p>${esc(p.tips)}</p></div><div class="section"><h3>가족 적합성 · ${esc(p.grade)}</h3><p>${esc(p.familyNotes)}</p></div>${food?`<div class="section"><h3>음식점 정보</h3><p>종류: ${esc(p.cuisine)} · 대기: ${esc(p.wait)} · ${esc(p.reservation)}</p></div>`:`<div class="section"><h3>관광지 입장료</h3><p>${yen(p.feeStatus)} · 성인 2명·어린이 2명 기준</p></div>`}<div class="section"><h3>주소</h3><p>${esc(p.address)}</p></div><div class="section"><h3>소개 URL</h3><ul class="sources">${links||'<li>확인 필요</li>'}</ul></div><div class="detailFooter"><button class="btn primary" id="detailAdd" type="button">날짜에 배치</button><a class="btn outline" href="${p.map}" target="_blank" rel="noreferrer">지도 열기</a></div>`;$('#backdrop').classList.add('open');$('#backdrop').setAttribute('aria-hidden','false');$('#close').onclick=closeDetail;$('#detailAdd').onclick=()=>chooseDay(id)}
function closeDetail(){$('#backdrop').classList.remove('open');$('#backdrop').setAttribute('aria-hidden','true');state.selected=null}function notice(t){const n=$('#notice');n.textContent=t;n.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>n.classList.remove('show'),2600)}function chooseDay(id){const answer=prompt(`${get(id).name}\n배치할 날짜를 1~6으로 입력하세요.`,'1');if(answer===null)return;const n=Number(answer);if(!Number.isInteger(n)||n<1||n>6){notice('DAY 1~DAY 6 중 하나를 입력하세요.');return}add(id,`day-${n}`)}function add(id,day){if(Object.values(state.schedule).some(a=>a.includes(id))){notice('같은 장소는 한 날짜에만 배치할 수 있습니다.');return}state.schedule[day].push(id);renderSchedule();renderPlaces();save();notice(`${get(id).name}을(를) ${day.replace('day-','DAY ')}에 배치했습니다.`)}function remove(id,day){state.schedule[day]=state.schedule[day].filter(x=>x!==id);renderSchedule();renderPlaces();save();notice('일정에서 삭제했습니다.')}
function bindPlaces(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>chooseDay(b.dataset.add));document.querySelectorAll('[data-drag]').forEach(c=>{c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.drag);c.classList.add('dragging')};c.ondragend=()=>c.classList.remove('dragging')})}function bindSchedule(){document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(b.dataset.remove,b.dataset.day));document.querySelectorAll('.day').forEach(d=>{d.ondragover=e=>{e.preventDefault();d.classList.add('drop')};d.ondragleave=()=>d.classList.remove('drop');d.ondrop=e=>{e.preventDefault();d.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');if(id)add(id,d.dataset.day)}})}
function save(){try{localStorage.setItem('fukuoka-family-trip-v1',JSON.stringify({schedule:state.schedule}));$('#saveState').textContent='● 자동 저장됨'}catch(e){$('#saveState').textContent='● 저장 불가'}}function restore(){try{const x=JSON.parse(localStorage.getItem('fukuoka-family-trip-v1'));if(x?.schedule)days.forEach(d=>state.schedule[d.id]=Array.isArray(x.schedule[d.id])?x.schedule[d.id].filter(id=>get(id)):[])}catch(e){}}
function syncTopbarHeight(){const tb=document.querySelector('.topbar');if(tb)document.documentElement.style.setProperty('--topbarH',tb.offsetHeight+'px')}
function setMobileTab(tab){document.querySelectorAll('.mobileTab').forEach(b=>b.classList.toggle('active',b.dataset.mobiletab===tab));const pp=$('#placesPanel'),sp=$('#schedulePanel');if(pp)pp.classList.toggle('mobileActive',tab==='places');if(sp)sp.classList.toggle('mobileActive',tab==='schedule')}
function init(){document.querySelectorAll('[data-mobiletab]').forEach(b=>b.onclick=()=>setMobileTab(b.dataset.mobiletab));setMobileTab('places');syncTopbarHeight();window.addEventListener('resize',syncTopbarHeight);[...new Set(places.map(p=>p.area))].sort().forEach(a=>$('#area').insertAdjacentHTML('beforeend',`<option value="${esc(a)}">${esc(a)}</option>`));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));renderPlaces()});$('#search').oninput=e=>{state.query=e.target.value;renderPlaces()};$('#area').onchange=e=>{state.area=e.target.value;renderPlaces()};$('#grade').onchange=e=>{state.grade=e.target.value;renderPlaces()};$('#reset').onclick=()=>{if(!confirm('배치한 일정을 모두 초기화할까요?'))return;days.forEach(d=>state.schedule[d.id]=[]);renderSchedule();renderPlaces();save();notice('일정을 초기화했습니다.')};$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeDetail()};document.onkeydown=e=>{if(e.key==='Escape')closeDetail()};restore();renderPlaces();renderSchedule();save()}init();
</script></body></html>
